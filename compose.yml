services:
  app:
    build: .
    image: tba-votacao:${APP_VERSION:-local}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY: "true"
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL}
      APP_ORIGIN: ${APP_ORIGIN:?Configure APP_ORIGIN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configure ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?Configure SESSION_SECRET}
    networks:
      portais-net:
        aliases:
          - ${APP_NETWORK_ALIAS:-tba-votacao}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
  backup:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      PGHOST: ${BACKUP_DB_HOST:-portais-postgres}
      PGPORT: 5432
      PGDATABASE: ${BACKUP_DB_NAME:-tba2026}
      PGUSER: ${BACKUP_DB_USER:-tba_votacao_app}
      PGPASSWORD: ${BACKUP_DB_PASSWORD:-}
    volumes:
      - ${BACKUP_DIR:-/srv/portais/backups/tba2026}:/backups
    networks:
      - portais-net
    entrypoint: ["/bin/sh", "-ec"]
    command: ["test -n \"$$PGPASSWORD\"; umask 077; pg_dump --format=custom --file=/backups/tba-$$(date -u +%Y%m%dT%H%M%SZ).dump"]
networks:
  portais-net:
    external: true
